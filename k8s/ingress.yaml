apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: spotify-app-ingress
  namespace: spotify-stats
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  tls:
    - hosts:
        - your-domain.de
      secretName: your-domain-de-tls
  rules:
    - host: your-domain.de
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: spotify-app-service
                port:
                  number: 8080