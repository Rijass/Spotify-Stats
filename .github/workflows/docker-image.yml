name: Build and Push Docker Image

on:
  push:
    branches: ["**"]

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    environment: Docker-hub

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Docker login test
        run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ vars.DOCKERHUB_USERNAME }}" --password-stdin

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Build and Push with Jib
        run: ./mvnw -B -DskipTests clean compile package jib:build
        env:
          JIB_TO_AUTH_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          JIB_TO_AUTH_PASSWORD: ${{ secrets.DOCKERHUB_TOKEN }}